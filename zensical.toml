[project]

site_name = "MoviesXMovies"

site_description = "All about MoviesXMovies"

site_author = "Ruben y Jonay"

repo_url = "https://github.com/moviesXmovies/moviesXmovies"

site_url = "https://moviesxmovies.github.io/MoviesXMovies"

repo_name = "Docs"

copyright = """
Copyright &copy; 2026 Ruben y Jonay
"""

nav = [
  { "Home" = "index.md", "icon" = "lucide/home" },
  { "Diagrams" = "diagrams.md", "icon" = "lucide/home" },
  { "Workflows" = "workflows.md", "icon" = "lucide/workflow" },
  { "Deployment" = "deployment.md", "icon" = "lucide/cloud-upload" },
  { "User Manual" = "user_manual.md", "icon" = "lucide/user" },
  { "Installation" = "installation.md", "icon" = "lucide/hard-drive-download" },
  { "Code Documentation" = "code.md", "icon" = "lucide/code" },


]

extra_javascript = ["assets/javascript/mermaid.mjs"]
extra_css = ["assets/css/extra.css"]


[project.theme]
favicon = "assets/img/favicon.svg"
language = "es"
logo = "assets/img/favicon.svg"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.instant.preview",
  "navigation.path",
  "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.integrate",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "deep purple"
accent = "deep purple"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
primary = "deep purple"
accent = "deep purple"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"


